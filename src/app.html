<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="svelte-palette — a customizable, themeable and accessible color palette component for Svelte 5. Explore every capability as a live, interactive card."
		/>
		<title>svelte-palette · capability showcase</title>
		<script>
			try {
				const saved = localStorage.getItem('svelte-palette-demo-theme')
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.dataset.theme = saved
				}
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="root">%sveltekit.body%</div>
	</body>
</html>
