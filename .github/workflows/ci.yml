name: 'ci'
on:
    pull_request:
    workflow_dispatch:
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    validate:
        runs-on: ubuntu-latest
        env:
            HUSKY: '0'
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - run: yarn install --frozen-lockfile
            - run: yarn lint
            - run: yarn run check
            - run: yarn test:ci
            - run: yarn build
